<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef Intern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="vignette"></div>
    <header class="hud">
      <h1>Chef Intern</h1>
      <span id="status" data-state="connecting">Connecting…</span>
    </header>
    <div class="play-hud" hidden>
      <section class="orders" id="orders" aria-label="Orders"></section>
      <div class="stat stat-score"><small>Score</small><b id="score">0</b></div>
      <div class="stat stat-timer"><small>Time left</small><b id="timer">3:00</b></div>
    </div>
    <section id="gameover" class="gameover" hidden>
      <div class="gameover-card">
        <p class="gameover-kicker">Service is over</p>
        <h2>Time's up!</h2>
        <p class="gameover-score"><b id="final-score">0</b> points</p>
        <p id="final-orders" class="gameover-orders"></p>
        <p class="gameover-hint">Press <kbd>E</kbd> or click to play again</p>
      </div>
    </section>
    <p class="hint">
      <kbd>WASD</kbd> move <span>·</span> <kbd>E</kbd> or <kbd>click</kbd> use <span>·</span> hold <kbd>F</kbd> or
      <kbd>right-click</kbd> chop <span>·</span> point the mouse to pick a nearby counter
    </p>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
