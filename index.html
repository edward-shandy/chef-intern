<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef Intern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="vignette"></div>
    <header class="hud">
      <h1>Chef Intern</h1>
      <div class="hud-right">
        <button id="leave" class="pill-button" type="button">Leave</button>
        <button id="music" class="pill-button" type="button">Music on</button>
        <button id="mute" class="pill-button" type="button">Sound on</button>
        <span id="status" data-state="connecting">Connecting…</span>
      </div>
    </header>
    <div class="play-hud" hidden>
      <section class="orders" id="orders" aria-label="Orders"></section>
      <div class="stat stat-score">
        <small id="level-name">Kitchen 1</small>
        <b><span id="score">0</span><span class="goal-of">/ <span id="target">0</span></span></b>
        <div class="goal" id="goal"><i></i></div>
      </div>
      <div class="stat stat-timer"><small>Time left</small><b id="timer">3:00</b></div>
    </div>
    <section id="waiting" class="lobby" hidden>
      <div class="lobby-card">
        <p class="lobby-kicker">Kitchen code</p>
        <h2 id="room-code" class="lobby-code"></h2>
        <ul id="lobby-chefs" class="lobby-chefs"></ul>
        <button id="start" class="button button-primary" type="button">Start service <kbd>Enter</kbd></button>
        <button id="invite" class="button" type="button">Copy invite link</button>
        <button id="leave-lobby" class="button button-quiet" type="button">Back to the front door</button>
      </div>
    </section>
    <section id="lobby" class="lobby" hidden>
      <div class="lobby-card">
        <h2>Chef Intern</h2>
        <p>Cook together online. Up to 4 chefs per kitchen.</p>
        <button id="create" class="button button-primary" type="button">Create a kitchen</button>
        <form id="join" class="lobby-join">
          <input id="join-code" maxlength="16" placeholder="Room code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" />
          <button class="button" type="submit">Join</button>
        </form>
      </div>
    </section>
    <section id="gameover" class="gameover" hidden>
      <div class="gameover-card">
        <p class="gameover-kicker" id="result-kicker"></p>
        <h2 id="result-title"></h2>
        <p class="gameover-score"><b id="final-score">0</b> / <span id="final-target">0</span> points</p>
        <div class="goal goal-large" id="final-goal"><i></i></div>
        <p id="final-orders" class="gameover-orders"></p>
        <p class="gameover-hint">Press <kbd>E</kbd> or click to <span id="result-next"></span></p>
      </div>
    </section>
    <p class="hint">
      <kbd>WASD</kbd> move <span>·</span> <kbd>Shift</kbd> dash <span>·</span> <kbd>E</kbd> or <kbd>click</kbd> use
      <span>·</span> hold <kbd>F</kbd> or <kbd>right-click</kbd> chop
    </p>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
